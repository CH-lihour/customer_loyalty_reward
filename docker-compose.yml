services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    ports:
      - "${HOST_PORT:-8443}:8443"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      CI: "true"
      CHOKIDAR_USEPOLLING: "true"
      PORT: "8443"
      FIGMA_DEV_SERVER_HOST: "0.0.0.0"
    command: sh -c "pnpm install --frozen-lockfile && exec pnpm dev"

volumes:
  node_modules:
